<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palette preview: flat vs sheen</title>
<style>
:root{--teal:#A8D4DC;--peri:#959BB9;--mauve:#73617B;--cocoa:#46292B;--black:#000}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#111;color:#fff;padding:24px}
h1{font-size:18px;font-weight:500;margin-bottom:16px}
.sw{display:flex;gap:8px;margin-bottom:24px}
.sw div{flex:1;height:56px;border-radius:10px;font-size:11px;padding:8px;display:flex;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.hero{position:relative;height:420px;border-radius:24px;overflow:hidden;padding:36px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,var(--teal),var(--peri) 55%,var(--mauve))}
.label{position:absolute;top:16px;left:20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa)}
.hero h2{font-size:44px;line-height:1;color:var(--black);font-weight:600;letter-spacing:-.02em}
.hero p{margin:10px 0 20px;color:var(--cocoa)}
.btn{align-self:flex-start;padding:12px 22px;border-radius:99px;font-weight:600;border:0;cursor:pointer;background:var(--black);color:var(--teal)}
.chip{display:inline-block;margin-right:6px;padding:5px 12px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.35);color:var(--cocoa)}
/* sheen version */
.sheen h2{background:linear-gradient(100deg,#000 20%,#5a4a8a 45%,#2b8a96 60%,#000 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
.sheen .btn{background:linear-gradient(110deg,#000,#2a2340,#000);position:relative;overflow:hidden;color:#fff}
.sheen .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(168,212,220,.7) 45%,rgba(255,190,220,.6) 52%,rgba(190,170,255,.6) 58%,transparent 70%);background-size:250% 100%;animation:sw 3.5s linear infinite}
.sheen .chip{background:linear-gradient(120deg,rgba(255,255,255,.55),rgba(210,190,255,.45),rgba(168,235,240,.55),rgba(255,210,230,.5));background-size:300% 100%;animation:sh 7s linear infinite}
.sheen::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(255,200,230,.55),transparent 40%),radial-gradient(circle at 20% 30%,rgba(190,255,245,.5),transparent 40%);mix-blend-mode:soft-light;animation:dr 9s ease-in-out infinite alternate}
@keyframes sh{to{background-position:-200% 0}}
@keyframes sw{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes dr{to{transform:translate(-6%,5%) scale(1.15)}}
.hero>*{position:relative}
</style></head><body>
<h1>Your palette, shown two ways</h1>
<div class="sw">
<div style="background:#A8D4DC;color:#46292B">#A8D4DC</div>
<div style="background:#959BB9;color:#000">#959BB9</div>
<div style="background:#73617B">#73617B</div>
<div style="background:#46292B">#46292B</div>
<div style="background:#000">#000000</div>
</div>
<div class="grid">
<div class="hero"><span class="label">Option 1 · Five colors only</span>
<h2>Sahithi Reddy</h2><p>Software Engineer · Backend · Cloud · AI</p>
<div style="margin-bottom:18px"><span class="chip">Kafka</span><span class="chip">AWS</span><span class="chip">Spring Boot</span></div>
<button class="btn">View my work</button></div>
<div class="hero sheen"><span class="label">Option 2 · With iridescent sheen (animated)</span>
<h2>Sahithi Reddy</h2><p>Software Engineer · Backend · Cloud · AI</p>
<div style="margin-bottom:18px"><span class="chip">Kafka</span><span class="chip">AWS</span><span class="chip">Spring Boot</span></div>
<button class="btn">View my work</button></div>
</div>
</body></html>
